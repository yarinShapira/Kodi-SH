name: Deploy GitHub Pages

# Sync main into gh-pages and generate lightweight Kodi repository/wizard zips
# at publish time. Release/build binaries stay out of source control.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: false

jobs:
  sync-main-to-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main tree to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          PUSHED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REMOTE="https://github.com/${REPO_SLUG}.git"
          gh auth setup-git

          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --depth=1 --single-branch --branch=gh-pages \
              --filter=blob:none --no-checkout "$REMOTE" gh
            cd gh
          else
            mkdir gh
            cd gh
            git init -b gh-pages
            git remote add origin "$REMOTE"
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          cd ..

          git clone --depth=1 --single-branch --branch=main \
            --filter=blob:none "$REMOTE" src

          cd src
          PUBLISH_PATHS="$(git ls-tree --name-only HEAD | grep -vxE 'dist|\.github|\.secrets')"
          git archive HEAD -- $PUBLISH_PATHS | tar -x -C ../gh
          cd ..

          python3 - <<'PY'
          from pathlib import Path
          import os, zipfile, shutil, hashlib

          src = Path('src')
          gh = Path('gh')

          def zip_dir(source_dir, dest_zip):
              source_dir = Path(source_dir)
              dest_zip = Path(dest_zip)
              dest_zip.parent.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(dest_zip, 'w', zipfile.ZIP_DEFLATED) as zf:
                  for path in source_dir.rglob('*'):
                      if path.is_file():
                          zf.write(path, path.relative_to(source_dir.parent))

          repo_addon = src / 'repository' / 'repository.kodipovilai'
          subs_addon = src / 'addons' / 'service.subtitles.kodipovilai'
          wizard_addon = src / 'wizard' / 'source' / 'plugin.program.kodipovilwizard'

          zip_dir(repo_addon, gh / 'repo' / 'repository.kodipovilai-1.0.0.zip')
          zip_dir(repo_addon, gh / 'repo' / 'zips' / 'repository.kodipovilai' / 'repository.kodipovilai-1.0.0.zip')
          zip_dir(subs_addon, gh / 'repo' / 'zips' / 'service.subtitles.kodipovilai' / 'service.subtitles.kodipovilai-0.2.291.zip')
          zip_dir(wizard_addon, gh / 'wizard' / 'plugin.program.kodipovilwizard-0.1.30.zip')
          shutil.copy2(gh / 'wizard' / 'plugin.program.kodipovilwizard-0.1.30.zip', gh / 'wizard' / 'plugin.program.kodipovilwizard-latest.zip')

          addons_xml = gh / 'repo' / 'addons.xml'
          (gh / 'repo' / 'addons.xml.md5').write_text(hashlib.md5(addons_xml.read_bytes()).hexdigest())
          PY

          mkdir -p gh/downloads
          gh release download --repo "$REPO_SLUG" \
            --pattern "Kodi-SH-64bit.apk" \
            --pattern "Kodi-SH-32bit.apk" \
            --dir gh/downloads --clobber \
            || echo "No release APK assets yet; skipping APK publish."

          touch gh/.nojekyll
          cd gh
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish; gh-pages already matches main."
            exit 0
          fi
          SHORT_SHA="$(echo "$PUSHED_SHA" | cut -c1-7)"
          git commit -q -m "Publish main@${SHORT_SHA}"
          git push origin gh-pages
